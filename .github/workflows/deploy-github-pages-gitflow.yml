name: GitFlow CI/CD — Deploy GitHub Pages (Default URL) & Pacote Hotmart/Local

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      custom_domain:
        description: 'Domínio customizado opcional (deixe em branco para usar o padrão https://engjuliocosta.github.io/cebraspelab/)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: 'pages-gitflow-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # ESTÁGIO 1 (GitFlow CI): Testes Unitários Backend + Build Frontend
  # Roda em develop, feature PRs, release/*, hotfix/* e main
  # ===========================================================================
  gitflow-ci-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar uv & Python 3.12
        uses: astral-sh/setup-uv@v4

      - name: Instalar dependências e Compilar Frontend (URL Padrão do GitHub Pages)
        run: |
          npm install --prefix frontend
          npm run build --prefix frontend

      - name: Preparar Build GitHub Pages (Sem CNAME para usar a URL padrão do GitHub Pages)
        run: |
          rm -f frontend/dist/CNAME
          DOMAIN="${{ github.event.inputs.custom_domain || vars.CEBRASPELAB_CUSTOM_DOMAIN || '' }}"
          if [ -n "$DOMAIN" ]; then
            echo "$DOMAIN" > frontend/dist/CNAME
            echo "CNAME opcional configurado: https://$DOMAIN"
          else
            echo "Usando URL padrão do GitHub Pages: https://${{ github.repository_owner }}.github.io/cebraspelab/"
          fi
          touch frontend/dist/.nojekyll

      - name: Gerar Executável Universal (CebraspeLab-Universal.pyz) & Pacote Hotmart (.zip)
        run: |
          uv run --directory backend python ../empacotar_universal.py
          uv run --directory backend python ../empacotar_hotmart.py

      - name: Executar Suíte Completa de Testes Unitários (47 Testes)
        run: uv run --directory backend python -m unittest discover -s tests -v

      - name: Publicar Build Estático na Branch gh-pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
        run: |
          WORK_DIR="$(mktemp -d)"
          cp -r frontend/dist/. "$WORK_DIR/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-temp
          git rm -rf . >/dev/null 2>&1 || true
          cp -r "$WORK_DIR"/. .
          rm -f CNAME
          git add -A
          git commit -m "deploy(pages): publicar interface na URL padrao do GitHub Pages"
          git push -f origin HEAD:gh-pages
          git checkout -f "${{ github.ref_name }}"

      - name: Upload do Artefato GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Upload do Kit Comercial Hotmart & Executável Universal
        uses: actions/upload-artifact@v4
        with:
          name: Pacote-Comercial-Hotmart-e-Universal
          path: |
            dist/Pacote_Hotmart_CebraspeLab.zip
            dist/CebraspeLab-Universal.pyz
            CebraspeLab-Universal.cmd

  # ===========================================================================
  # ESTÁGIO 2 (GitFlow CD): Publicação via GitHub Actions Pages (se habilitado)
  # ===========================================================================
  gitflow-deploy-github-pages:
    needs: gitflow-ci-test-and-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - name: Configurar GitHub Pages automaticamente
        id: pages_cfg
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Publicar Interface no GitHub Pages
        id: deployment
        if: steps.pages_cfg.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Status da Publicação GitHub Pages
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "✅ Publicado via GitHub Actions Pages em: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "✅ Build publicado com sucesso na branch 'gh-pages'!"
            echo "🌐 URL Padrão do GitHub Pages: https://${{ github.repository_owner }}.github.io/cebraspelab/"
          fi
