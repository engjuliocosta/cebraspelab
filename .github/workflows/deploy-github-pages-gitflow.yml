name: GitFlow CI/CD — Deploy GitHub Pages (Top-Level URL) & Pacote Hotmart/Local

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      custom_domain:
        description: 'Domínio de Alto Nível para o GitHub Pages (sem subpasta de repo, ex: app.cebraspelab.com.br)'
        required: false
        default: 'app.cebraspelab.com.br'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: 'pages-gitflow-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # ESTÁGIO 1 (GitFlow CI): Testes Unitários Backend + Build Frontend Base '/'
  # Roda em develop, feature PRs, release/*, hotfix/* e main
  # ===========================================================================
  gitflow-ci-test-and-build:
    runs-on: ubuntu-latest
    outputs:
      top_level_domain: ${{ steps.domain_cfg.outputs.domain }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar uv & Python 3.12
        uses: astral-sh/setup-uv@v4

      - name: Instalar dependências e Compilar Frontend (base '/' — URL de Alto Nível)
        run: |
          npm install --prefix frontend
          npm run build --prefix frontend

      - name: Configurar URL de Alto Nível (CNAME app.cebraspelab.com.br sem vínculo com nome do repo)
        id: domain_cfg
        run: |
          DOMAIN="${{ github.event.inputs.custom_domain || vars.CEBRASPELAB_CUSTOM_DOMAIN || 'app.cebraspelab.com.br' }}"
          echo "$DOMAIN" > frontend/dist/CNAME
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
          echo "CNAME configurado para URL de Alto Nível: https://$DOMAIN"
          touch frontend/dist/.nojekyll

      - name: Gerar Executável Universal (CebraspeLab-Universal.pyz) & Pacote Hotmart (.zip)
        run: |
          uv run --directory backend python ../empacotar_universal.py
          uv run --directory backend python ../empacotar_hotmart.py

      - name: Executar Suíte Completa de Testes Unitários (47 Testes)
        run: uv run --directory backend python -m unittest discover -s tests -v

      - name: Publicar Build Estático na Branch gh-pages (Compatível com Deploy from Branch)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
        run: |
           WORK_DIR="$(mktemp -d)"
          cp -r frontend/dist/. "$WORK_DIR/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-temp
          git rm -rf . >/dev/null 2>&1 || true
          cp -r "$WORK_DIR"/. .
          git add -A
          git commit -m "deploy(pages): publicar interface em https://app.cebraspelab.com.br/"
          git push -f origin HEAD:gh-pages
          git checkout -f "${{ github.ref_name }}"

      - name: Upload do Artefato GitHub Pages (Root '/')
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Upload do Kit Comercial Hotmart & Executável Universal
        uses: actions/upload-artifact@v4
        with:
          name: Pacote-Comercial-Hotmart-e-Universal
          path: |
            dist/Pacote_Hotmart_CebraspeLab.zip
            dist/CebraspeLab-Universal.pyz
            CebraspeLab-Universal.cmd

  # ===========================================================================
  # ESTÁGIO 2 (GitFlow CD): Publicação via GitHub Actions Pages (se habilitado)
  # ===========================================================================
  gitflow-deploy-github-pages:
    needs: gitflow-ci-test-and-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - name: Configurar GitHub Pages automaticamente
        id: pages_cfg
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Publicar Interface no GitHub Pages (URL de Alto Nível)
        id: deployment
        if: steps.pages_cfg.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Status da Publicação GitHub Pages
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "✅ Publicado via GitHub Actions Pages em: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "✅ Build publicado com sucesso na branch 'gh-pages'!"
            echo "👉 Para ativar no painel do GitHub (1 única vez): Acesse https://github.com/${{ github.repository }}/settings/pages"
            echo "   e escolha 'Deploy from a branch -> gh-pages / (root)' OU 'Source: GitHub Actions'."
          fi
